name: lint

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            make shellcheck shfmt stow yamllint
          npm install --global markdownlint-cli2@0.23.3 prettier@3.9.6
      - name: run checks
        run: make check
